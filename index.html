<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monitos Sonoros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: la hoja ocupa toda la pantalla; una barra mínima de íconos tenues abajo */
:root{
  --bg:#e3ebe2; --paper:#f5f9f3; --grid:#dbe6dc; --grid-strong:#b7cdbd; --band:rgba(40,110,78,.06); --lane:rgba(25,37,31,.035);
  --ink:#19251f; --muted:#6b7d73; --hover:rgba(25,37,31,.07); --head:#d6442a; --focus:#2d6cd2; --shadow:rgba(25,50,38,.22);
  --i1:#14936a; --i2:#d0452b; --i3:#6b59d4; --i4:#de8710; --i5:#2b4ec6; --i6:#d1529a; --i7:#3a9fd8; --i8:#19251f;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d161b; --paper:#13212a; --grid:#1b2e38; --grid-strong:#2b4652; --band:rgba(120,210,170,.05); --lane:rgba(229,238,232,.035);
    --ink:#e5eee8; --muted:#7f958b; --hover:rgba(229,238,232,.08); --head:#ff6b4e; --focus:#80b1ff; --shadow:rgba(0,0,0,.5);
    --i1:#33c58f; --i2:#ff6c50; --i3:#9b8cff; --i4:#ffab3d; --i5:#7091ff; --i6:#ff80c0; --i7:#6dc7f6; --i8:#e5eee8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d161b; --paper:#13212a; --grid:#1b2e38; --grid-strong:#2b4652; --band:rgba(120,210,170,.05); --lane:rgba(229,238,232,.035);
  --ink:#e5eee8; --muted:#7f958b; --hover:rgba(229,238,232,.08); --head:#ff6b4e; --focus:#80b1ff; --shadow:rgba(0,0,0,.5);
  --i1:#33c58f; --i2:#ff6c50; --i3:#9b8cff; --i4:#ffab3d; --i5:#7091ff; --i6:#ff80c0; --i7:#6dc7f6; --i8:#e5eee8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;
  display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 10px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.sheet{position:relative;flex:1;min-height:240px;border-radius:10px;overflow:hidden;background:var(--paper);
  box-shadow:0 18px 40px -26px var(--shadow);touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.sheet[data-tool="erase"]{cursor:cell}
.sheet canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:12px;right:14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);opacity:0;transition:opacity .25s;pointer-events:none}
.hud.on{opacity:1}
.tag{position:absolute;left:50%;bottom:14px;transform:translate(-50%,4px);display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--grid-strong),0 8px 20px -12px var(--shadow);font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.tag.on{opacity:1;transform:translate(-50%,0)}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tag.drum i{border-radius:2px}
.sig{position:absolute;right:14px;bottom:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;color:var(--muted);opacity:.7;pointer-events:none;user-select:none}

.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;min-height:40px}
.grp{display:flex;align-items:center;gap:2px}
.right{display:flex;align-items:center;gap:2px}
.oct-wrap{display:flex;align-items:center}
.ib.only-m{display:none}
button{touch-action:manipulation}
@media (max-width:720px){
  .bar{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"t r" "c c";gap:6px 4px}
  .bar>.grp:first-child{grid-area:t}
  .bar>.grp.center{grid-area:c;justify-self:center}
  .right{grid-area:r;justify-self:end}
  .ib{width:29px}
  .ib.sm{width:20px}
  .right,.right .grp{gap:0}
  #bpm{min-width:50px!important}
  .sw{width:28px;height:30px}
  .palette{gap:2px}
  .grp.center{gap:8px!important}
  .ib.only-m{display:grid}
  #helpBtn{display:none}
  .sep{display:none}
  .settings{position:absolute;right:0;bottom:calc(100% + 8px);z-index:30;flex-wrap:wrap;justify-content:center;gap:4px 10px;
    max-width:100%;padding:8px 10px;border-radius:12px;background:var(--paper);
    box-shadow:0 0 0 1px var(--grid-strong),0 14px 30px -16px var(--shadow)}
  .settings:not(.open){display:none}
  .settings .sel{opacity:1;color:var(--ink);font-size:13px}
  .settings .num{color:var(--ink)}
}
.ib{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;opacity:.75;transition:opacity .15s,background .15s,color .15s}
.ib:hover,.ib:focus-visible{opacity:1;background:var(--hover);color:var(--ink)}
.ib[aria-pressed="true"]{opacity:1;color:var(--ink);background:var(--hover)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.play{opacity:1;color:var(--ink)}
.ib.play svg{fill:currentColor;stroke:none;width:17px;height:17px}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.ib.sm{width:24px;font-size:15px;line-height:1}
.ib.txt{width:auto;padding:0 8px;font-family:var(--f-mono);font-size:12px}
.sep{width:1px;height:18px;background:var(--grid-strong);margin:0 6px}

.palette{display:flex;align-items:center;gap:4px}
.sw{width:30px;height:30px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.sw i{display:block;width:14px;height:14px;border-radius:50%;background:var(--c);transition:transform .15s,box-shadow .15s}
.sw.drum i{border-radius:3px}
.sw{position:relative}
.sw::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translate(-50%,3px);padding:4px 10px;border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--grid-strong),0 8px 18px -10px var(--shadow);font-size:12px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;z-index:20}
.sw:hover::after,.sw:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.sw:hover i{transform:scale(1.15)}
.sw[aria-pressed="true"] i{transform:scale(1.2);box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--c)}

.mode{display:flex;align-items:center;gap:2px;padding:2px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--grid-strong)}
.mode .ib{width:32px;height:30px}
.ib.fresh{opacity:1}
.ib.fresh svg{stroke:url(#dg)}
.ib.fresh svg circle{fill:url(#dg)}
.ib .dots{stroke-dasharray:.1 3.4}
body.vapor .sw i{background:transparent;box-shadow:inset 0 0 0 2.5px var(--c)}
body.vapor .sw[aria-pressed="true"] i{box-shadow:inset 0 0 0 2.5px var(--c),0 0 0 3px var(--paper),0 0 0 4.5px var(--c)}
.tag.hollow i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.sel{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--muted);font-family:var(--f-mono);font-size:12px;padding:8px 6px;border-radius:8px;cursor:pointer;opacity:.75}
.sel:hover,.sel:focus-visible{opacity:1;background:var(--hover);color:var(--ink)}
.sel option{background:var(--paper);color:var(--ink)}

.help{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--paper);border-radius:10px;
  box-shadow:0 0 0 1px var(--grid-strong),0 18px 40px -20px var(--shadow);padding:14px 18px;
  display:grid;grid-template-columns:auto auto;gap:5px 18px;font-size:13px;max-width:calc(100% - 32px)}
.help kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
.help span{color:var(--muted)}
@media (prefers-reduced-motion: reduce){.hud,.ib,.sw i,.sw::after{transition:none}}
</style>
</head>
<body>


<div class="sheet" id="sheet" data-tool="pen">
  <canvas id="cv" aria-label="Hoja de dibujo musical"></canvas>
  <div class="hud" id="hud"></div>
  <div class="sig">2026 • Frabaros y Claudito</div>
  <div class="tag" id="tag" aria-live="polite"><i></i><span></span></div>
  <div class="help" id="help" hidden>
    <kbd>Espacio</kbd><span>play / pausa</span>
    <kbd>1 – 8</kbd><span>instrumento · 8 batería</span>
    <kbd>V</kbd><span>tinta / vapor</span>
    <kbd>E</kbd><span>borrador</span>
    <kbd>Z</kbd><span>deshacer</span>
    <kbd>⌫</kbd><span>limpiar</span>
    <kbd>D</kbd><span>dado</span>
    <kbd>R</kbd><span>volver al smile</span>
    <kbd>↑ ↓</kbd><span>tempo</span>
    <kbd>← →</kbd><span>tónica</span>
    <kbd>S</kbd><span>escala</span>
    <kbd>[ ]</kbd><span>octava</span>
    <kbd>G</kbd><span>grilla 16 / 32</span>
  </div>
</div>

<nav class="bar" aria-label="Controles">
  <div class="grp">
    <button class="ib play" id="play" aria-label="Reproducir" title="Play (Espacio)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="ib sm" id="bpmDown" aria-label="Bajar tempo" title="Tempo (↓)">−</button>
    <span class="num" id="bpm" aria-label="Tempo en pulsos por minuto" style="min-width:58px">90 bpm</span>
    <button class="ib sm" id="bpmUp" aria-label="Subir tempo" title="Tempo (↑)">+</button>
  </div>

  <div class="grp center" style="gap:12px">
    <div class="palette" id="palette" role="group" aria-label="Instrumento"></div>
    <div class="mode" role="group" aria-label="Tipo de trazo">
      <button class="ib" id="ink" aria-pressed="true" aria-label="Tinta: el trazo se queda" title="Tinta · se queda (V)"><svg viewBox="0 0 24 24"><path d="M3 14c3-6 6-6 9 0s6 6 9 0"/></svg></button>
      <button class="ib" id="vapor" aria-pressed="false" aria-label="Vapor: suena una vez y se borra" title="Vapor · suena una vez (V)"><svg viewBox="0 0 24 24"><path class="dots" d="M3 14c3-6 6-6 9 0s6 6 9 0"/></svg></button>
    </div>
  </div>

  <div class="right">
    <div class="grp tools">
      <button class="ib" id="erase" aria-pressed="false" aria-label="Borrador" title="Borrador (E)"><svg viewBox="0 0 24 24"><path d="M20 20H9l-5-5a1.5 1.5 0 0 1 0-2l9-9a1.5 1.5 0 0 1 2 0l5 5a1.5 1.5 0 0 1 0 2l-9 9"/><path d="M7.5 10.5l6 6"/></svg></button>
      <button class="ib" id="undo" aria-label="Deshacer" title="Deshacer (Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="clear" aria-label="Limpiar" title="Limpiar (⌫)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button class="ib fresh" id="dice" aria-label="Dibujo al azar" title="Dado (D)"><svg viewBox="0 0 24 24"><defs><linearGradient id="dg" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="24" y2="20" spreadMethod="repeat"><stop offset="0" style="stop-color:var(--i6)"/><stop offset=".34" style="stop-color:var(--i4)"/><stop offset=".67" style="stop-color:var(--i7)"/><stop offset="1" style="stop-color:var(--i6)"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="24 16" dur="2.2s" repeatCount="indefinite"/></linearGradient></defs><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/></svg></button>
    </div>
    <div class="grp settings" id="settings" role="group" aria-label="Ajustes de sonido">
      <span class="sep"></span>
      <select class="sel" id="root" aria-label="Tónica" title="Tónica (← →)"></select>
      <select class="sel" id="scale" aria-label="Escala" title="Escala (S)"></select>
      <span class="oct-wrap"><button class="ib sm" id="octDown" aria-label="Bajar octava" title="Octava ([)">−</button><span class="num" id="oct" style="min-width:40px">oct 3</span><button class="ib sm" id="octUp" aria-label="Subir octava" title="Octava (])">+</button></span>
      <button class="ib txt" id="grid" aria-label="Pasos de la grilla de batería" title="Pasos de la grilla de batería (G)">32 pasos</button>
    </div>
    <div class="grp meta">
      <button class="ib" id="reset" aria-label="Volver al smile" title="Volver al smile (R)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 14c.9 1.7 2.1 2.5 3.8 2.5s2.9-.8 3.8-2.5"/><circle cx="9.3" cy="9.6" r=".9" fill="currentColor"/><circle cx="14.7" cy="9.6" r=".9" fill="currentColor"/></svg></button>
      <button class="ib only-m" id="setBtn" aria-label="Ajustes de sonido" aria-pressed="false" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      <button class="ib" id="helpBtn" aria-label="Atajos de teclado" aria-pressed="false" title="Atajos (?)"><svg viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.25c-.7.35-1.1.9-1.1 1.6V14"/><circle cx="12" cy="17.5" r=".9" fill="currentColor"/></svg></button>
    </div>
  </div>
</nav>

<script>
(() => {
const INSTR = [
  {id:'marimba', name:'Marimba', tok:'--i1'},
  {id:'pluck',   name:'Cuerda',  tok:'--i2'},
  {id:'pad',     name:'Pad',     tok:'--i3', hold:true},
  {id:'bell',    name:'Campana', tok:'--i4'},
  {id:'bass',    name:'Bajo',    tok:'--i5', hold:true},
  {id:'lead',    name:'Lead',    tok:'--i6', hold:true},
  {id:'glass',   name:'Cristal', tok:'--i7'},
  {id:'drums',   name:'Batería', tok:'--i8'},
];
const DRUM = 7, LANES = 7; // hi-hat, caja, tom 1–4 (agudo a grave), bombo
const DRUM_NAMES = ['hi-hat','caja','tom 1','tom 2','tom 3','tom 4','bombo'];
const SCALES = {
  pmin:{name:'pent menor', s:[0,3,5,7,10]},
  pmaj:{name:'pent mayor', s:[0,2,4,7,9]},
  maj:{name:'mayor', s:[0,2,4,5,7,9,11]},
  min:{name:'menor', s:[0,2,3,5,7,8,10]},
  dor:{name:'dórica', s:[0,2,3,5,7,9,10]},
  blues:{name:'blues', s:[0,3,5,6,7,10]},
  jap:{name:'in', s:[0,1,5,7,8]},
};
const SKEYS = Object.keys(SCALES);
const NOTES = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const KEY = 'monitos-sonoros-v1', SEEN = 'monitos-sonoros-dado';

const S = {strokes:[], hits:[], instr:3, tool:'pen', mode:'ink', scale:'pmin', root:0, oct:3, steps:32, bpm:90, playing:false};
const undoStack = [];
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const scaleArr = () => SCALES[S.scale].s;
const nRows = () => scaleArr().length * 3 + 1;
function rowMidi(r){ const s = scaleArr(), L = s.length; return 12*(S.oct+1) + S.root + 12*Math.floor(r/L) + s[r%L]; }
const loopLen = () => 32 * 60 / S.bpm / 4; // siempre 2 compases

/* ---------- partitura ---------- */
let events = [], dirty = true;
function resample(p){
  if (p.length < 2) return p.slice();
  const out = [p[0]];
  for (let i=1;i<p.length;i++){
    const [x0,y0] = p[i-1], [x1,y1] = p[i];
    const n = Math.max(1, Math.ceil(Math.hypot(x1-x0, (y1-y0)*.5)/.002));
    for (let k=1;k<=n;k++) out.push([x0+(x1-x0)*k/n, y0+(y1-y0)*k/n]);
  }
  return out;
}
function pieces(p){
  const r = resample(p);
  if (r.length < 2) return [r];
  const out = []; let cur = [r[0]], dir = 0;
  for (let i=1;i<r.length;i++){
    const dx = r[i][0]-r[i-1][0], d = dx > 1e-7 ? 1 : dx < -1e-7 ? -1 : 0;
    if (d && dir && d !== dir){ out.push(cur); cur = [r[i-1]]; }
    if (d) dir = d;
    cur.push(r[i]);
  }
  out.push(cur);
  return out.map(pc => pc[0][0] <= pc[pc.length-1][0] ? pc : pc.slice().reverse());
}
function compile(){
  const rows = nRows(), ev = [];
  const rowAt = y => clamp(Math.floor((1-y)*rows), 0, rows-1);
  for (const st of S.strokes){
    const hold = INSTR[st.c].hold;
    for (const pc of pieces(st.p)){
      if (!pc.length) continue;
      if (hold){
        const steps = []; let last = -1;
        for (const [x,y] of pc){ const r = rowAt(y); if (r !== last){ steps.push({x, row:r}); last = r; } }
        ev.push({type:'hold', x:pc[0][0], x1:pc[pc.length-1][0], c:st.c, steps, piece:pc});
      } else {
        let last = -1, px = -1, k = 0;
        for (const [x,y] of pc){
          const r = rowAt(y); if (r === last) continue; last = r;
          k = x - px < .0015 ? k+1 : 0; px = x;
          if (k <= 12) ev.push({type:'hit', x, y, row:r, c:st.c, k});
        }
      }
    }
  }
  const seen = new Set();
  for (const [c32, lane] of S.hits){
    const step = Math.floor(c32 * S.steps / 32), key = step + ':' + lane;
    if (seen.has(key)) continue; seen.add(key);
    ev.push({type:'drum', x:step/S.steps, step, lane});
  }
  ev.sort((a,b) => a.x - b.x);
  events = ev; dirty = true;
}

/* ---------- audio ---------- */
let ctx = null, master, impulse, noiseBuf, bus = null;
const mtof = m => 440*Math.pow(2,(m-69)/12);
function makeBus(){
  const b = ctx.createGain(); b.connect(master);
  const revIn = ctx.createGain(), conv = ctx.createConvolver(), revOut = ctx.createGain();
  conv.buffer = impulse; revOut.gain.value = .5;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(b);
  return {g:b, rev:revIn};
}
function ensureAudio(){
  if (!ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .2;
    master = ctx.createGain(); master.gain.value = .8; master.connect(comp); comp.connect(ctx.destination);
    const len = ctx.sampleRate*2.4|0; impulse = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch=0; ch<2; ch++){ const d = impulse.getChannelData(ch); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3); }
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    bus = makeBus();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function out(g, wet){ g.connect(bus.g); if (wet){ const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(bus.rev); } }
function O(type, f, t, stop){ const o = ctx.createOscillator(); o.type = type; if (f) o.frequency.setValueAtTime(f, t); o.start(t); o.stop(stop); return o; }
function G(v){ const g = ctx.createGain(); g.gain.value = v; return g; }
function noise(t, d){ const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.start(t, Math.random()*.5); s.stop(t+d); return s; }
function filt(type, f, q){ const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

// notas sueltas (instrumentos de golpe)
function play(ci, midi, t, vel){
  const id = INSTR[ci].id, f = mtof(midi), g = ctx.createGain(); g.gain.setValueAtTime(.0001, t);
  const V = v => Math.max(.0002, v*vel);

/* ---------- puntero ---------- */

  const s = [], h = [], TAU = Math.PI*2;
  const r = sheet.getBoundingClientRect(), A = clamp(r.height/Math.max(1, r.width), .25, 2);
  const cx = .5, cy = .5, ry = Math.min(.30, .42/A), rx = ry*A, u = ry/.30;
  const circle = (x, y, rad, n) => { const p = []; for (let i=0;i<=n;i++){ const a = -Math.PI/2 + i/n*TAU; p.push([x + rad*A*Math.cos(a), y + rad*Math.sin(a)]); } return p; };
  // cara: círculo perfecto en pixeles, centrado
  s.push({c:3, p:circle(cx, cy, ry, 96)});
  // ojos: círculos
  s.push({c:3, p:circle(cx - ry*A*.42, cy - .10*u, .06*u, 32)});
  s.push({c:3, p:circle(cx + ry*A*.42, cy - .10*u, .06*u, 32)});
  // sonrisa
  const smile = []; for (let i=0;i<=28;i++){ const t = Math.PI*(.12 + .76*i/28); smile.push([cx + .17*u*A*Math.cos(t), cy + .02*u + .17*u*Math.sin(t)]); }
  s.push({c:3, p:smile});
  // pelo magenta (vapor)
  [[.025,0],[.075,2],[.125,4]].forEach(([y0,ph]) => {
    const p = []; for (let i=0;i<=44;i++){ const t = i/44; p.push([cx - rx*.95 + rx*1.9*t, y0 + .02*Math.sin(t*TAU*2 + ph)]); }
    s.push({c:5, p, eph:true});
  });
  // colchón de pads
  [[.02,.245,[0,2]],[.26,.49,[0,1]],[.51,.74,[1,2]],[.755,.98,[0,2]]].forEach(([x0,x1,rows]) => {
    rows.forEach(r => { const y = 1-(r+.5)/16; s.push({c:2, p:[[x0,y],[x1,y]]}); });
  });
  [0,8,16,24].forEach(k => h.push([k,6]));
  [4,12,20].forEach(k => h.push([k,1]));
  for (let k=2; k<28; k+=4) h.push([k,0]);
  [[28,2],[29,3],[30,4],[31,5]].forEach(x => h.push(x));
  return {s, h};
}
function surpriseSketch(){
  const R = Math.random, s = [], h = [];
  const melC = [0,1,3,5,6][R()*5|0];
  let x = R()*.05;
  while (x < .94){
    const len = .06 + R()*.16, p = []; let y = .15 + R()*.35;
    for (let t=0; t<=len && x+t<.99; t+=.008){ y = clamp(y+(R()-.5)*.07, .06, .6); p.push([x+t, y]); }
    s.push({c:melC, p}); x += len + .02 + R()*.08;
  }
  for (let b=0; b<4; b++){ const y = .72 + R()*.2; s.push({c:4, p:[[b*.25+.01,y],[b*.25+.21,y+(R()-.5)*.08]]}); }
  if (R() < .75) [0,.5].forEach(x0 => { const y = .38 + R()*.12; s.push({c:2, p:[[x0+.01,y],[x0+.24,y]]}); s.push({c:2, p:[[x0+.01,y+.1],[x0+.24,y+.1]]}); });
  const fill = R() < .6;
  for (let k=0; k<32; k++){
    if (fill && k >= 28){ h.push([k, 2 + (k-28)]); continue; }
    if (k%8 === 0 || (k%2 === 0 && R() < .15)) h.push([k,6]);
    if (k%8 === 4 || (k%8 === 7 && R() < .25)) h.push([k,1]);
    if ((k%2 === 0 && R() < .9) || (k%2 === 1 && R() < .2)) h.push([k,0]);
    if (R() < .05) h.push([k, 2 + (R()*4|0)]);
  }
  return {s, h};
}
function markDiceSeen(){ $('dice').classList.remove('fresh'); try { localStorage.setItem(SEEN, '1'); } catch(e){} }
function loadSketch(sk){ setTool('pen'); markDiceSeen(); pushUndo(); S.strokes = sk.s; S.hits = sk.h; compile(); save(); }

/* ---------- guardado ---------- */
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      const strokes = S.strokes.filter(s => !s.eph).map(s => ({c:s.c, p:s.p.map(([x,y]) => [+x.toFixed(4), +y.toFixed(4)])}));
      localStorage.setItem(KEY, JSON.stringify({strokes, hits:S.hits.filter(h => !h[2]), mode:S.mode, instr:S.instr, scale:S.scale, root:S.root, oct:S.oct, steps:S.steps, bpm:S.bpm}));
    } catch(e){}
  }, 300);
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!d) return false;
    Object.assign(S, {mode:d.mode === 'vapor' ? 'vapor' : 'ink', instr:d.instr ?? 2, scale:SCALES[d.scale] ? d.scale : 'pmin', root:d.root ?? 0, oct:d.oct ?? 3, steps:d.steps === 16 ? 16 : 32, bpm:d.bpm ?? 90});
    S.strokes = Array.isArray(d.strokes) ? d.strokes : [];
    S.hits = Array.isArray(d.hits) ? d.hits : [];
    return S.strokes.length + S.hits.length > 0;
  } catch(e){ return false; }
}

/* ---------- controles ---------- */
let hudT = null;
function hud(text){ const el = $('hud'); el.textContent = text; el.classList.add('on'); clearTimeout(hudT); hudT = setTimeout(() => el.classList.remove('on'), 900); }

const pal = $('palette');
INSTR.forEach((ins, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === DRUM ? ' drum' : '');
  b.style.setProperty('--c', `var(${ins.tok})`);
  b.setAttribute('aria-label', ins.name); b.dataset.tip = `${ins.name} \u00b7 ${i+1}`;
  b.innerHTML = '<i></i>';
  b.addEventListener('click', () => setInstr(i, true));
  pal.appendChild(b);
});
let tagT = null;
function showTag(text){
  const el = $('tag');
  el.style.setProperty('--c', `var(${INSTR[S.instr].tok})`);
  el.classList.toggle('drum', S.instr === DRUM);
  el.classList.toggle('hollow', S.mode === 'vapor');
  el.querySelector('span').textContent = text;
  el.classList.add('on'); clearTimeout(tagT); tagT = setTimeout(() => el.classList.remove('on'), 1400);
}
function setMode(m, show){
  setTool('pen'); S.mode = m; document.body.classList.toggle('vapor', m === 'vapor');
  $('ink').setAttribute('aria-pressed', m === 'ink'); $('vapor').setAttribute('aria-pressed', m === 'vapor');
  if (show) showTag(m === 'vapor' ? 'Vapor · suena una vez' : 'Tinta · se queda');
  save();
}
function setInstr(i, show){
  setTool('pen'); S.instr = i;
  [...pal.children].forEach((b,k) => b.setAttribute('aria-pressed', k === i));
  dirty = true; save();
  if (!show) return;
  showTag(INSTR[i].name);
  if (!ensureAudio()) return;
  const t = ctx.currentTime + .01;
  if (i === DRUM){ drum(6, t, .8); drum(0, t+.16, .8); drum(1, t+.32, .8); }
  else play(i, rowMidi(scaleArr().length), t, .6);
}
function setTool(t){ S.tool = t; sheet.dataset.tool = t; $('erase').setAttribute('aria-pressed', t === 'erase'); }
function setBpm(v, show){
  const old = loopLen(); S.bpm = clamp(Math.round(v), 40, 220); $('bpm').textContent = S.bpm + ' bpm';
  if (S.playing && ctx){ t0 = cursor - ((cursor - t0)/old) * loopLen(); }
  if (show) hud(S.bpm + ' bpm'); save();
}
function setSteps(n, show){ S.steps = n; $('grid').textContent = n + ' pasos'; compile(); if (show) hud('grilla ' + n); save(); }
function setRoot(r, show){ S.root = (r+12)%12; $('root').value = S.root; dirty = true; if (show) hud(NOTES[S.root] + ' · ' + SCALES[S.scale].name); save(); }
function setScale(k, show){ S.scale = k; $('scale').value = k; compile(); if (show) hud(NOTES[S.root] + ' · ' + SCALES[k].name); save(); }
function setOct(o, show){ S.oct = clamp(o, 1, 5); $('oct').textContent = 'oct ' + S.oct; dirty = true; if (show) hud('octava ' + S.oct); save(); }
function undo(){ if (!undoStack.length) return; const d = JSON.parse(undoStack.pop()); S.strokes = d.s; S.hits = d.h; compile(); save(); }
function clearAll(){ if (!S.strokes.length && !S.hits.length) return; pushUndo(); S.strokes = []; S.hits = []; compile(); save(); }
function toggleHelp(force){ const h = $('help'), on = force ?? h.hidden; h.hidden = !on; $('helpBtn').setAttribute('aria-pressed', on); }

SKEYS.forEach(k => $('scale').add(new Option(SCALES[k].name, k)));
NOTES.forEach((n,i) => $('root').add(new Option(n, i)));
$('scale').addEventListener('change', e => setScale(e.target.value));
$('root').addEventListener('change', e => setRoot(+e.target.value));
$('play').addEventListener('click', () => setPlaying(!S.playing));
$('bpmDown').addEventListener('click', () => setBpm(S.bpm-2));
$('bpmUp').addEventListener('click', () => setBpm(S.bpm+2));
$('grid').addEventListener('click', () => setSteps(S.steps === 32 ? 16 : 32, true));
$('erase').addEventListener('click', () => setTool(S.tool === 'erase' ? 'pen' : 'erase'));
$('undo').addEventListener('click', undo);
$('clear').addEventListener('click', clearAll);
$('reset').addEventListener('click', () => loadSketch(faceSketch()));
$('dice').addEventListener('click', () => loadSketch(surpriseSketch()));
$('helpBtn').addEventListener('click', () => toggleHelp());
$('ink').addEventListener('click', () => setMode('ink', true));
$('vapor').addEventListener('click', () => setMode('vapor', true));
$('octDown').addEventListener('click', () => setOct(S.oct-1));
$('octUp').addEventListener('click', () => setOct(S.oct+1));

document.addEventListener('pointerdown', e => {
  if ($('help').hidden) return;
  if (e.target.closest('#help') || e.target.closest('#helpBtn')) return;
  toggleHelp(false);
}, true);
function toggleSettings(force){
  const el = $('settings'), on = force ?? !el.classList.contains('open');
  el.classList.toggle('open', on);
  $('setBtn').setAttribute('aria-pressed', on); $('setBtn').setAttribute('aria-expanded', on);
}
$('setBtn').addEventListener('click', () => toggleSettings());
document.addEventListener('pointerdown', e => {
  if (!$('settings').classList.contains('open')) return;
  if (e.target.closest('#settings') || e.target.closest('#setBtn')) return;
  toggleSettings(false);
}, true);

document.addEventListener('keydown', e => {
  if ((e.target.tagName || '').toLowerCase() === 'select') return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space'){ e.preventDefault(); setPlaying(!S.playing); return; }
  if (/^[1-8]$/.test(k)) return setInstr(+k - 1, true);
  switch (k){
    case 'v': case 'V': return setMode(S.mode === 'vapor' ? 'ink' : 'vapor', true);
    case 'e': case 'E': return setTool(S.tool === 'erase' ? 'pen' : 'erase');
    case 'z': case 'Z': return undo();
    case 'Backspace': case 'Delete': e.preventDefault(); return clearAll();
    case 'r': case 'R': return loadSketch(faceSketch());
    case 'd': case 'D': return loadSketch(surpriseSketch());
    case 'ArrowUp': e.preventDefault(); return setBpm(S.bpm + (e.shiftKey ? 10 : 2), true);
    case 'ArrowDown': e.preventDefault(); return setBpm(S.bpm - (e.shiftKey ? 10 : 2), true);
    case 'ArrowRight': e.preventDefault(); return setRoot(S.root+1, true);
    case 'ArrowLeft': e.preventDefault(); return setRoot(S.root-1, true);
    case 's': case 'S': { const i = SKEYS.indexOf(S.scale); return setScale(SKEYS[(i + (e.shiftKey ? SKEYS.length-1 : 1)) % SKEYS.length], true); }
    case '[': return setOct(S.oct-1, true);
    case ']': return setOct(S.oct+1, true);
    case 'g': case 'G': return setSteps(S.steps === 32 ? 16 : 32, true);
    case '?': case 'h': case 'H': return toggleHelp();
    case 'Escape': return toggleHelp(false);
  }
});

const mq = window.matchMedia('(prefers-color-scheme: dark)');
(mq.addEventListener ? mq.addEventListener('change', readTokens) : mq.addListener(readTokens));
new MutationObserver(readTokens).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

if (!load()){ const m = faceSketch(); S.strokes = m.s; S.hits = m.h; }
$('scale').value = S.scale; $('root').value = S.root; $('bpm').textContent = S.bpm + ' bpm'; $('grid').textContent = S.steps + ' pasos'; $('oct').textContent = 'oct ' + S.oct;
setInstr(S.instr); setTool('pen'); setMode(S.mode);
(() => {
  let seen = false; try { seen = localStorage.getItem(SEEN) === '1'; } catch(e){}
  const el = $('dice');
  if (seen) el.classList.remove('fresh');
  else if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) el.querySelectorAll('animateTransform').forEach(a => a.remove());
})();
readTokens(); compile();
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
